# E1 - Baseline ResNet-50 sobre Kaggle, split por foto original.
# Exigido por la rubrica del Avance ("Resultados preliminares ResNet").
name: e1_resnet50_kaggle
model: resnet50          # IMAGENET1K_V2 (80,86) - emparejado con vit_b_16 (81,07)
dataset: kaggle

epochs: 30
batch_size: 64
accum_steps: 1           # batch efectivo 64

# Receta ResNet: dos niveles. Backbone 3e-5, cabeza 3e-4.
lr: 3.0e-5
head_lr_mult: 10.0
weight_decay: 0.05
warmup_frac: 0.03

label_smoothing: 0.1     # identico en ambas ramas; se declara al analizar calibracion
grad_clip: 1.0
num_workers: 8
seeds: [0, 1, 2]
